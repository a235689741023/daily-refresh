name: 每日抓取並部署

on:
  schedule:
    # 以下註解皆為台北時間（UTC+8），cron 本身寫的是 UTC。
    # 06:30 晨間主更新：美股前一日收盤與隔夜國際消息都已到齊
    - cron: "30 22 * * *"
    # 11:00 台股盤中補抓：早盤走勢與法人動向已成形
    - cron: "0 3 * * *"
    # 21:00 美股盤前：對應美東 09:00（夏令）／08:00（冬令），開盤前的最後一份情報
    - cron: "0 13 * * *"
  workflow_dispatch: # 允許手動觸發
  push:
    branches: [main]
    paths-ignore:
      - "public/data/**"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: 抓取四大領域資料
        env:
          # 選配：設定後會多一層 Claude 判讀（今日重點摘要、為何重要）
          # 在 repo 的 Settings → Secrets and variables → Actions 新增
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: Asia/Taipei
        run: npm run fetch

      - name: 把資料存回 repo（保留歷史，也當作下次的備援）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "資料無變化，略過 commit"
          else
            git commit -m "chore: 每日資料更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
